<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="260" cy="110" r="140" fill="url(#skyGrad)"/>

  <!-- Left Trees -->
  <ellipse cx="60" cy="170" rx="35" ry="30" fill="url(#treeGrad)" opacity="0.6"/>
  <ellipse cx="90" cy="165" rx="30" ry="35" fill="url(#treeGrad)" opacity="0.8"/>
  <ellipse cx="120" cy="175" rx="25" ry="25" fill="url(#treeGrad)" opacity="0.7"/>

  <!-- Right Trees -->
  <ellipse cx="400" cy="175" rx="25" ry="25" fill="url(#treeGrad)" opacity="0.7"/>
  <ellipse cx="430" cy="165" rx="30" ry="35" fill="url(#treeGrad)" opacity="0.8"/>
  <ellipse cx="460" cy="170" rx="35" ry="30" fill="url(#treeGrad)" opacity="0.6"/>

  <!-- Base Steps / Podium -->
  <path d="M120 195 L400 195 L395 202 L125 202 Z" fill="#c7d2fe"/>
  <path d="M130 188 L390 188 L385 195 L135 195 Z" fill="#e0e7ff"/>
  <path d="M140 182 L380 182 L375 188 L145 188 Z" fill="#ffffff"/>

  <!-- Main Building Body -->
  <rect x="150" y="90" width="220" height="92" rx="2" fill="url(#bldgGrad)"/>
  <!-- Central Entrance Arch -->
  <rect x="235" y="125" width="50" height="57" rx="25" fill="url(#shadowGrad)"/>
  <path d="M242 140 L242 182 M278 140 L278 182" stroke="#a5b4fc" stroke-width="2"/>

  <!-- Windows -->
  <rect x="168" y="115" width="24" height="38" rx="12" fill="#818cf8" opacity="0.35"/>
  <rect x="202" y="115" width="24" height="38" rx="12" fill="#818cf8" opacity="0.35"/>
  <rect x="294" y="115" width="24" height="38" rx="12" fill="#818cf8" opacity="0.35"/>
  <rect x="328" y="115" width="24" height="38" rx="12" fill="#818cf8" opacity="0.35"/>

  <!-- Classical Columns / Pillars -->
  <!-- Col 1 -->
  <rect x="160" y="90" width="12" height="92" fill="#ffffff"/>
  <rect x="158" y="86" width="16" height="5" rx="1" fill="#c7d2fe"/>
  <rect x="158" y="179" width="16" height="4" rx="1" fill="#c7d2fe"/>
  <!-- Col 2 -->
  <rect x="195" y="90" width="12" height="92" fill="#ffffff"/>
  <rect x="193" y="86" width="16" height="5" rx="1" fill="#c7d2fe"/>
  <rect x="193" y="179" width="16" height="4" rx="1" fill="#c7d2fe"/>
  <!-- Col 3 -->
  <rect x="230" y="90" width="12" height="92" fill="#ffffff"/>
  <rect x="228" y="86" width="16" height="5" rx="1" fill="#c7d2fe"/>
  <rect x="228" y="179" width="16" height="4" rx="1" fill="#c7d2fe"/>
  <!-- Col 4 -->
  <rect x="278" y="90" width="12" height="92" fill="#ffffff"/>
  <rect x="276" y="86" width="16" height="5" rx="1" fill="#c7d2fe"/>
  <rect x="276" y="179" width="16" height="4" rx="1" fill="#c7d2fe"/>
  <!-- Col 5 -->
  <rect x="313" y="90" width="12" height="92" fill="#ffffff"/>
  <rect x="311" y="86" width="16" height="5" rx="1" fill="#c7d2fe"/>
  <rect x="311" y="179" width="16" height="4" rx="1" fill="#c7d2fe"/>
  <!-- Col 6 -->
  <rect x="348" y="90" width="12" height="92" fill="#ffffff"/>
  <rect x="346" y="86" width="16" height="5" rx="1" fill="#c7d2fe"/>
  <rect x="346" y="179" width="16" height="4" rx="1" fill="#c7d2fe"/>

  <!-- Entablature / Frieze -->
  <rect x="145" y="76" width="230" height="12" fill="#ffffff"/>
  <rect x="142" y="73" width="236" height="4" fill="#e0e7ff"/>

  <!-- Triangular Pediment -->
  <polygon points="140,73 260,25 380,73" fill="url(#bldgGrad)" stroke="#c7d2fe" stroke-width="1.5"/>
  <polygon points="152,70 260,29 368,70" fill="#ffffff"/>

  <!-- Inscription "SPI" in Pediment Tympanum -->
  <text x="260" y="60" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="900" fill="#6366f1" text-anchor="middle" letter-spacing="3">SPI</text>

  <!-- Dome / Cupola on top -->
  <ellipse cx="260" cy="22" rx="20" ry="12" fill="#a5b4fc" opacity="0.7"/>
  <rect x="258" y="6" width="4" height="10" fill="#6366f1"/>
  <circle cx="260" cy="5" r="2.5" fill="#f59e0b"/>
</svg>
