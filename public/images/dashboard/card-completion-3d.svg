<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="trophyShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#trophyShadow)">
    <!-- Pedestal Base Lower Block -->
    <path d="M14 36 L34 36 L36 41 C36 41.8 35.2 42.5 34.2 42.5 L13.8 42.5 C12.8 42.5 12 41.8 12 41 Z" fill="url(#pedestalGrad)" stroke="#1e293b" stroke-width="0.8"/>
    
    <!-- Pedestal Upper Step -->
    <rect x="15" y="32" width="18" height="4.5" rx="1.5" fill="#334155" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Gold Plaque on Base -->
    <rect x="18" y="37" width="12" height="3" rx="0.75" fill="#fef08a" stroke="#d97706" stroke-width="0.5"/>

    <!-- Trophy Stem -->
    <path d="M21 26 L27 26 L25.5 32 L22.5 32 Z" fill="url(#trophyGold)"/>
    <ellipse cx="24" cy="32" rx="3.5" ry="1.2" fill="#d97706"/>

    <!-- Left Handle -->
    <path d="M16 13 C10 13 8 20 15 23 L16.5 21 C12 18.5 13 15 16.5 15 Z" fill="url(#trophyGold)" stroke="#d97706" stroke-width="0.5"/>

    <!-- Right Handle -->
    <path d="M32 13 C38 13 40 20 33 23 L31.5 21 C36 18.5 35 15 31.5 15 Z" fill="url(#trophyGold)" stroke="#d97706" stroke-width="0.5"/>

    <!-- Main Cup Body -->
    <path d="M15 10 C15 10 15 26 24 26 C33 26 33 10 33 10 Z" fill="url(#trophyGold)" stroke="#d97706" stroke-width="0.8"/>

    <!-- Cup Rim Opening (Perspective Ellipse) -->
    <ellipse cx="24" cy="10" rx="9" ry="2.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8"/>
    <ellipse cx="24" cy="10" rx="7.5" ry="1.8" fill="#b45309" opacity="0.6"/>

    <!-- Specular Star Shine Highlight on Cup -->
    <ellipse cx="20" cy="15" rx="2" ry="4" fill="#ffffff" opacity="0.45" transform="rotate(-15, 20, 15)"/>
  </g>
</svg>
